version: 2
updates:
- package-ecosystem: bundler
  directory: "/"
  schedule:
    interval: monthly
  open-pull-requests-limit: 10
  groups:
    bundler-security:
      applies-to: security-updates
      patterns:
      - "*"
    bundler-minor-patch:
      applies-to: version-updates
      update-types:
      - minor
      - patch
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: monthly
  open-pull-requests-limit: 10
  groups:
    actions-security:
      applies-to: security-updates
      patterns:
      - "*"
    actions-minor-patch:
      applies-to: version-updates
      update-types:
      - minor
      - patch
